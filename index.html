<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Controle de Chamados Suporte Geodigitus</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="main-nav" aria-label="Navegação principal">
      <a class="active" href="index.html">Controle de chamados</a>
      <a href="calculadora.html">Calculadora de profundidade</a>
    </nav>

  <main class="container">
    <h1>CONTROLE DE CHAMADOS SUPORTE GEODIGITUS</h1>

    <section class="card cadastro">
      <h2>Cadastro</h2>

      <div class="form-grid">
        <label>Equipamento
          <input id="cpu" type="text" placeholder="Ex: CPU-001234">
        </label>

        <label>Cliente
          <input id="cliente" type="text" placeholder="Nome do cliente">
        </label>

        <label>Data
          <input id="data" type="text" placeholder="DD/MM/AAAA">
        </label>
      </div>

      <label>Relato / Anotação
        <textarea id="problema" rows="4" placeholder="Descreva o problema ou anotação..."></textarea>
      </label>

      <div class="buttons">
        <button id="btnSalvar" class="success" onclick="salvar()">SALVAR</button>
        <button class="primary" onclick="limpar()">LIMPAR</button>
        <button id="btnCancelar" class="cancel" onclick="cancelarEdicao()" disabled>
          CANCELAR EDIÇÃO
        </button>
      </div>
    </section>

    <section class="busca">
      <label>Buscar:
        <input id="busca" type="search"
               placeholder="Equipamento, cliente, data ou relato..."
               oninput="filtrar()">
      </label>

      <button class="primary" onclick="carregarDados()">ATUALIZAR</button>
      <button class="purple" onclick="imprimirTudo()">IMPRIMIR TUDO</button>
    </section>

    <section id="status"></section>
    <section id="blocos" class="blocos"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
